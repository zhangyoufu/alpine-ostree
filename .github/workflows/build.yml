# Builds composefs + ostree (composefs-enabled) APKs for Alpine, per branch
# and architecture, and publishes the resulting apk repository to GitHub Pages.
#
# The published repository is consumable as a normal Alpine apk repo:
#   https://<user>.github.io/<repo>/v3.24/main
# (apk appends the architecture directory, e.g. .../v3.24/main/x86_64)

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGER: Youfu Zhang <zhangyoufu@gmail.com>

jobs:
  # Generate the signing key ONCE so every architecture signs with the same
  # key. Uses the PRIVATE_KEY secret when configured (key name
  # <github.owner>.rsa); otherwise a throwaway key named dummy.rsa (with a
  # loud warning). Key material is shared via job outputs, base64-encoded so
  # the multi-line PEM survives the output/env round-trip.
  prepare-key:
    runs-on: ubuntu-latest
    outputs:
      key_filename:    ${{ steps.key.outputs.key_filename }}
      private_key_b64: ${{ steps.key.outputs.private_key_b64 }}
      public_key_b64:  ${{ steps.key.outputs.public_key_b64 }}
    steps:
      - name: Generate signing key
        id: key
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |-
          set -eux
          if [ -n "${PRIVATE_KEY}" ]; then
            KEY_FILENAME="${GITHUB_REPOSITORY_OWNER}.rsa"
            printf '%s\n' "${PRIVATE_KEY}" > "/tmp/${KEY_FILENAME}"
          else
            # no secret configured: use a throwaway key (packages still build,
            # but are signed with a key that is not published)
            KEY_FILENAME=dummy.rsa
            openssl genrsa -out "/tmp/${KEY_FILENAME}" 4096
            echo "::warning::No PRIVATE_KEY secret configured; packages are signed with a throwaway key and cannot be trusted. Set the PRIVATE_KEY repository secret to publish a usable repository."
          fi
          openssl rsa -in "/tmp/${KEY_FILENAME}" -pubout -out "/tmp/${KEY_FILENAME}.pub"
          {
            echo "key_filename=${KEY_FILENAME}"
            echo "private_key_b64=$(base64 -w0 "/tmp/${KEY_FILENAME}")"
            echo "public_key_b64=$(base64 -w0 "/tmp/${KEY_FILENAME}.pub")"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runner }}
    needs: prepare-key
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 on the standard x64 runner, aarch64 natively on an arm64
          # runner (no QEMU/binfmt emulation -> much faster)
          - alpine_version: v3.24
            docker_arch: amd64
            runner: ubuntu-26.04
          - alpine_version: v3.24
            docker_arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare abuild key
        env:
          PRIVATE_KEY_B64: ${{ needs.prepare-key.outputs.private_key_b64 }}
          PUBLIC_KEY_B64:  ${{ needs.prepare-key.outputs.public_key_b64 }}
          KEY_FILENAME:    ${{ needs.prepare-key.outputs.key_filename }}
        run: |-
          set -eux
          mkdir -p .abuild
          echo "PACKAGER='${PACKAGER}'" > .abuild/abuild.conf
          printf '%s' "${PRIVATE_KEY_B64}" | base64 -d > ".abuild/${KEY_FILENAME}"
          echo "PACKAGER_PRIVKEY='/root/.abuild/${KEY_FILENAME}'" >> .abuild/abuild.conf
          printf '%s' "${PUBLIC_KEY_B64}" | base64 -d > ".abuild/${KEY_FILENAME}.pub"
          chmod 600 ".abuild/${KEY_FILENAME}"
          ls -la .abuild

      - name: Build packages
        env:
          ALPINE_VERSION: ${{ matrix.alpine_version }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          KEY_FILENAME: ${{ needs.prepare-key.outputs.key_filename }}
        run: |-
          set -eux
          case "${DOCKER_ARCH}" in
            amd64)   PLATFORM="linux/amd64" ;;
            aarch64) PLATFORM="linux/arm64" ;;
            *)       echo "unsupported arch: ${DOCKER_ARCH}" >&2; exit 1 ;;
          esac
          # library/alpine is multi-platform; docker resolves the variant via --platform
          docker run --rm --interactive \
            --platform "${PLATFORM}" \
            --volume "$PWD":/work --workdir /work \
            --env PACKAGER --env KEY_FILENAME --env ALPINE_VERSION \
            alpine:${ALPINE_VERSION#v} /bin/sh -eux <<'EOF'
            # the runner may leak HOME=/home/runner into the container
            export HOME=/root
            apk update
            apk add --no-cache abuild

            ALPINE_ARCH="$(apk --print-arch)"
            REPODEST="/work/repo/${ALPINE_VERSION}"
            echo "building for Alpine ${ALPINE_VERSION} / ${ALPINE_ARCH}"

            mkdir -p /root/.abuild
            cp /work/.abuild/abuild.conf /root/.abuild/
            cp "/work/.abuild/${KEY_FILENAME}" /root/.abuild/
            cp "/work/.abuild/${KEY_FILENAME}.pub" /root/.abuild/
            chmod 600 "/root/.abuild/${KEY_FILENAME}"
            cp "/root/.abuild/${KEY_FILENAME}.pub" /etc/apk/keys/

            # composefs (needed by ostree; provides libcomposefs + pkg-config)
            cd /work/main/composefs
            abuild -F -r -P "${REPODEST}"

            # the build above already indexes + signs the repo; expose it so
            # ostree's build can resolve makedepends from it
            echo "file://${REPODEST}" >> /etc/apk/repositories
            apk update --no-cache

            # ostree with composefs support
            cd /work/main/ostree
            abuild -F -r -P "${REPODEST}"
            find "${REPODEST}" -maxdepth 3 -type f | sort
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.alpine_version }}-${{ matrix.docker_arch }}
          path: repo/
          if-no-files-found: error

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, prepare-key]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all built repos
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble Pages site
        env:
          PUBLIC_KEY_B64: ${{ needs.prepare-key.outputs.public_key_b64 }}
          KEY_FILENAME:   ${{ needs.prepare-key.outputs.key_filename }}
        run: |-
          set -eux
          mkdir -p _site
          # upload-artifact stores the *contents* of repo/ at the artifact root
          cp -a artifacts/*/. _site/
          # publish the signing key at a stable location; it comes from the
          # prepare-key job output (single key shared by every architecture)
          mkdir -p _site/keys
          printf '%s' "${PUBLIC_KEY_B64}" | base64 -d > "_site/keys/${KEY_FILENAME}.pub"
          # artifact-based Pages serves the files as-is; no .nojekyll needed
          find _site -maxdepth 4 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
