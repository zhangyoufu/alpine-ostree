# Builds composefs + ostree (composefs-enabled) APKs for Alpine, per branch
# and architecture, and publishes the resulting apk repository to GitHub Pages.
#
# Build stage uses a throwaway key (no secret involvement). Before publishing,
# every package is RE-SIGNED with the real key, which lives as an environment
# secret on the "github-pages" environment (only jobs using that environment
# - i.e. the main-branch publish job - can see it).
#
# The published repository is consumable as a normal Alpine apk repo:
#   https://<user>.github.io/<repo>/v3.24/main
# (apk appends the architecture directory, e.g. .../v3.24/main/x86_64)

name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform.github_runner }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 on the standard x64 runner, arm64 natively on an arm64 runner
        # (no QEMU/binfmt emulation -> much faster).
        # NOTE: the job itself stays on the runner: GitHub does not support
        # JavaScript actions (checkout/upload-artifact) inside containers on
        # arm64 runners, so the Alpine build runs via a docker step instead.
        alpine_version: [v3.24]
        platform:
          - docker_arch: amd64
            github_runner: ubuntu-26.04
          - docker_arch: arm64
            github_runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare throwaway abuild key
        env:
          PACKAGER: ${{ vars.PACKAGER }}
        run: |-
          set -eu
          mkdir -p .abuild
          echo "PACKAGER='${PACKAGER}'" > .abuild/abuild.conf
          echo "PACKAGER_PRIVKEY='/root/.abuild/dummy.rsa'" >> .abuild/abuild.conf
          openssl genrsa -out .abuild/dummy.rsa 4096
          openssl rsa -in .abuild/dummy.rsa -pubout -out .abuild/dummy.rsa.pub
          chmod 600 .abuild/dummy.rsa
          echo "throwaway key ready (packages are re-signed at publish time)"

      - name: Build packages
        env:
          ALPINE_VERSION: ${{ matrix.alpine_version }}
          DOCKER_ARCH: ${{ matrix.platform.docker_arch }}
        run: |-
          set -eu
          # library/alpine is multi-platform; the runner's docker resolves the
          # variant for the target arch directly (amd64/arm64)
          docker run --rm --interactive \
            --platform "linux/${DOCKER_ARCH}" \
            --volume "$PWD":/work --workdir /work \
            --env ALPINE_VERSION \
            alpine:${ALPINE_VERSION#v} /bin/sh -eu <<'EOF'
            # the runner may leak HOME=/home/runner into the container
            export HOME=/root
            apk update
            apk add --no-cache abuild

            ALPINE_ARCH="$(apk --print-arch)"
            REPODEST="/work/repo/${ALPINE_VERSION}"
            echo "building for Alpine ${ALPINE_VERSION} / ${ALPINE_ARCH}"

            mkdir -p /root/.abuild
            cp /work/.abuild/abuild.conf /root/.abuild/
            cp /work/.abuild/dummy.rsa /root/.abuild/
            cp /work/.abuild/dummy.rsa.pub /root/.abuild/
            chmod 600 /root/.abuild/dummy.rsa
            cp /root/.abuild/dummy.rsa.pub /etc/apk/keys/

            # composefs (needed by ostree; provides libcomposefs + pkg-config)
            cd /work/main/composefs
            abuild -F -r -P "${REPODEST}"

            # the build above already indexes + signs the repo; expose it so
            # ostree's build can resolve makedepends from it
            echo "file://${REPODEST}" >> /etc/apk/repositories
            apk update --no-cache

            # ostree with composefs support
            cd /work/main/ostree
            abuild -F -r -P "${REPODEST}"
            find "${REPODEST}" -maxdepth 3 -type f | sort
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.alpine_version }}-${{ matrix.platform.docker_arch }}
          path: repo/
          if-no-files-found: error

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Download all built repos
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble Pages site
        run: |-
          set -eu
          mkdir -p _site
          # upload-artifact stores the *contents* of repo/ at the artifact root
          cp -a artifacts/*/. _site/
          # artifact-based Pages serves the files as-is; no .nojekyll needed
          find _site -maxdepth 4 -type f | sort

      - name: Re-sign packages with the real key
        env:
          # environment secret on "github-pages" (main branch only)
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          KEY_FILENAME: ${{ github.repository_owner }}.rsa
        run: |-
          set -eu
          if [ -n "${PRIVATE_KEY}" ]; then
            printf '%s\n' "${PRIVATE_KEY}" > key.rsa
            chmod 600 key.rsa
            openssl rsa -in key.rsa -pubout -out key.rsa.pub
            echo "re-signing with ${KEY_FILENAME}"
            docker run --rm --interactive \
              --volume "$PWD":/work --workdir /work \
              --env KEY_FILENAME alpine:latest /bin/sh -eu <<'EOF'
              export HOME=/root
              apk update >/dev/null
              apk add --no-cache abuild >/dev/null
              mkdir -p /root/.abuild
              echo "PACKAGER_PRIVKEY='/root/.abuild/${KEY_FILENAME}'" > /root/.abuild/abuild.conf
              cp /work/key.rsa /root/.abuild/${KEY_FILENAME}
              chmod 600 /root/.abuild/${KEY_FILENAME}
              cp /work/key.rsa.pub /root/.abuild/${KEY_FILENAME}.pub

              for archdir in /work/_site/*/main/*/; do
                arch="$(basename "$archdir")"
                echo "re-signing ${arch}"
                cd "$archdir"
                for apk in *.apk; do
                  abuild-gzsplit < "$apk"
                  rm -f signatures.tar.gz
                  abuild-sign -q -k "/root/.abuild/${KEY_FILENAME}" control.tar.gz
                  cat control.tar.gz data.tar.gz > "$apk.new"
                  rm -f control.tar.gz data.tar.gz
                  mv "$apk.new" "$apk"
                done
                apk index --no-warnings --quiet --output APKINDEX.tar.gz \
                  --rewrite-arch "$arch" *.apk
                abuild-sign -q -k "/root/.abuild/${KEY_FILENAME}" APKINDEX.tar.gz
                cd /work
              done

              mkdir -p /work/_site/keys
              cp /root/.abuild/${KEY_FILENAME}.pub /work/_site/keys/
          EOF
          echo "re-signed all packages + indexes"
          else
            echo "::warning::github-pages environment secret PRIVATE_KEY not set; publishing with the build-stage dummy signatures"
          fi
          find _site -maxdepth 4 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
